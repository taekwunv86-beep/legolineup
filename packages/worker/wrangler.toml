name = "desco-edu-worker"
main = "src/index.ts"
compatibility_date = "2025-05-01"
compatibility_flags = ["nodejs_compat"]

# 환경변수 (운영 시크릿은 `wrangler secret put` 으로 별도 등록)
[vars]
ENVIRONMENT = "development"

# D1 binding — DB ID는 `wrangler d1 create desco-edu` 후 채워 넣을 것
[[d1_databases]]
binding = "DB"
database_name = "desco-edu"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"
